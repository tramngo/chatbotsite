<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren · TBN Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:    #14243A;   /* deep navy */
    --slate:  #4A6483;   /* blue-grey, secondary text */
    --blue:   #3F7CB8;   /* action blue */
    --mist:   #DDE5EE;   /* assistant bubbles */
    --greige: #F2F0EC;   /* warm off-grey */
    --brass:  #C08A4A;   /* single warm accent */
    --paper:  #FFFFFF;

    --display:"Fraunces", Georgia, serif;
    --body:   "Karla", system-ui, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0 }

  html,body{ height:100% }
  body{
    font-family:var(--body);
    color:var(--ink);
    background:transparent;                 /* lets the host page show through */
    display:flex; align-items:center; justify-content:center;
    padding:12px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- the card ---------- */
  .card{
    width:100%; max-width:440px; height:100%; max-height:720px;
    display:flex; flex-direction:column;
    background:var(--paper);
    border:1px solid var(--mist);
    border-radius:18px;
    box-shadow:0 20px 44px -24px rgba(20,36,58,.35);
    overflow:hidden;
  }

  /* ---------- header ---------- */
  .head{
    display:flex; align-items:center; gap:12px;
    padding:16px 18px;
    background:var(--ink); color:#fff;
  }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex:none;
    background:var(--blue); color:#fff;
    font-family:var(--display); font-size:18px; font-weight:600;
    display:grid; place-items:center;
  }
  .head .who{ font-weight:700; font-size:15px; line-height:1.2 }
  .head .sub{ font-size:12px; color:#9FB3CC; display:flex; align-items:center; gap:6px; margin-top:2px }
  .pulse{ width:7px; height:7px; border-radius:50%; background:#57B98A; box-shadow:0 0 0 0 rgba(87,185,138,.6); animation:ping 2s infinite }
  @keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(87,185,138,.5) } 70%{ box-shadow:0 0 0 6px rgba(87,185,138,0) } 100%{ box-shadow:0 0 0 0 rgba(87,185,138,0) } }
  .brandtag{ margin-left:auto; font-family:var(--display); font-size:13px; color:#C7D4E4; letter-spacing:.01em }

  /* ---------- message log ---------- */
  .log{
    flex:1; overflow-y:auto; scroll-behavior:smooth;
    padding:18px; display:flex; flex-direction:column; gap:11px;
    background:var(--greige);
  }
  .msg{ max-width:86%; padding:11px 14px; font-size:14.5px; line-height:1.5; animation:rise .28s ease-out both }
  .msg.bot{ background:#fff; color:var(--ink); border:1px solid var(--mist); border-radius:15px 15px 15px 5px; align-self:flex-start }
  .msg.me{ background:var(--blue); color:#fff; border-radius:15px 15px 5px 15px; align-self:flex-end }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }

  .typing{ display:flex; gap:4px; align-self:flex-start; background:#fff; border:1px solid var(--mist); padding:14px; border-radius:15px 15px 15px 5px }
  .typing i{ width:6px; height:6px; border-radius:50%; background:var(--slate); animation:blink 1.2s infinite }
  .typing i:nth-child(2){ animation-delay:.2s } .typing i:nth-child(3){ animation-delay:.4s }
  @keyframes blink{ 0%,60%,100%{ opacity:.3 } 30%{ opacity:1 } }

  /* booking confirmation */
  .booked{
    align-self:stretch; margin-top:2px;
    border:1px solid var(--brass); border-radius:14px;
    background:rgba(192,138,74,.10);
    padding:14px 16px; font-size:13.5px; line-height:1.5; color:var(--ink);
    animation:rise .3s ease-out both;
  }
  .booked .k{ font-family:var(--body); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--brass); display:block; margin-bottom:6px }
  .booked b{ display:block; font-size:15px; margin-bottom:3px }

  /* ---------- suggested replies ---------- */
  .chips{ display:flex; flex-wrap:wrap; gap:7px; padding:12px 18px 0 }
  .chip{
    font-family:var(--body); font-size:13px; color:var(--blue);
    background:#fff; border:1px solid var(--mist); border-radius:999px;
    padding:7px 13px; cursor:pointer; transition:.15s;
  }
  .chip:hover{ border-color:var(--blue); background:#F5F9FD }

  /* ---------- composer ---------- */
  .composer{ display:flex; gap:8px; align-items:center; padding:14px 14px 14px 18px; border-top:1px solid var(--mist); background:#fff }
  .composer input{
    flex:1; border:none; outline:none; font-family:var(--body); font-size:14.5px; color:var(--ink); background:none;
  }
  .composer input::placeholder{ color:#9AA9BC }
  .send{
    width:38px; height:38px; flex:none; border:none; border-radius:10px;
    background:var(--blue); color:#fff; cursor:pointer; font-size:16px; transition:.15s;
  }
  .send:hover{ background:#356BA0 }
  .send:disabled{ background:var(--mist); color:var(--slate); cursor:default }

  .foot{ text-align:center; font-size:10.5px; color:#9AA9BC; padding:0 0 10px; background:#fff }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important } }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px }
  .sr-only{ position:absolute; left:-9999px }
</style>

<div class="card" role="region" aria-label="Chat with Wren from TBN Strategy">
  <div class="head">
    <div class="avatar">W</div>
    <div>
      <div class="who">Wren</div>
      <div class="sub"><span class="pulse"></span>Online now</div>
    </div>
    <div class="brandtag">TBN Strategy</div>
  </div>

  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>

  <div class="composer">
    <label for="input" class="sr-only">Type your message to Wren</label>
    <input id="input" placeholder="Type your answer…" autocomplete="off">
    <button class="send" id="send" aria-label="Send message">↑</button>
  </div>
  <div class="foot">Wren is TBN Strategy's assistant · answers are reviewed by our team</div>
</div>

<script>
/* -------------------------------------------------------------
   The browser side. No API key here, no system prompt here —
   both live safely on the Netlify function this talks to.
------------------------------------------------------------- */

const ENDPOINT = "/.netlify/functions/chat";   // our own server on Netlify

const state = { history: [], busy: false };

const log   = document.getElementById('log');
const chips = document.getElementById('chips');
const input = document.getElementById('input');
const send  = document.getElementById('send');

function bubble(text, who){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function typing(on){
  document.getElementById('dots')?.remove();
  if(!on) return;
  const el = document.createElement('div');
  el.className = 'typing'; el.id = 'dots';
  el.innerHTML = '<i></i><i></i><i></i>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function renderChips(list){
  chips.innerHTML = '';
  (list||[]).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = t;
    b.onclick = ()=> ask(t);
    chips.appendChild(b);
  });
}
function renderBooking(slot){
  const el = document.createElement('div');
  el.className = 'booked';
  el.innerHTML = `<span class="k">Consultation requested</span><b>${slot}</b>A TBN Strategy consultant will confirm by email.`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function ask(text){
  if(state.busy || !text.trim()) return;
  state.busy = true; send.disabled = true;
  bubble(text, 'me');
  renderChips([]);
  input.value = '';
  state.history.push({ role:'user', content:text });
  typing(true);

  try{
    const res = await fetch(ENDPOINT, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ messages: state.history })
    });
    if(!res.ok) throw new Error("server " + res.status);
    const out = await res.json();

    typing(false);
    bubble(out.reply, 'bot');
    state.history.push({ role:'assistant', content: JSON.stringify(out) });

    if(out.booking) renderBooking(out.booking);
    renderChips(out.chips);
  }catch(err){
    typing(false);
    bubble("Sorry — that didn't go through. Could you try sending it once more?", 'bot');
    console.error(err);
  }

  state.busy = false; send.disabled = false; input.focus();
}

send.onclick = ()=> ask(input.value);
input.onkeydown = e => { if(e.key === 'Enter') ask(input.value); };

/* opening message */
bubble("Hi! I'm Wren, TBN Strategy's assistant. We help 501(c)(3) nonprofits win grant funding. I can see if we're a good fit and get you on the calendar — mind if I ask a couple of quick questions?", 'bot');
renderChips(["Sure, go ahead","Tell me about TBN first"]);
input.focus();
</script>
